[project]
name = "artistica-backend"
version = "0.1.0"
description = "Backend for ArtisTica"
authors = [
    {name = "Esteban", email = "esteban@example.com"}
]
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.2",
    "httpx>=0.26.0",
    "pillow>=10.2.0",
    "sentry-sdk[fastapi]>=1.40.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.2.1",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
