services:
  db:
    # Imagen de Postgres 15 configurada directamente con pgvector
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=artistica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    # Ejecuta migraciones e inicia el server con hot reload (watch de src)
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/artistica
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/artistica
      - SUPABASE_URL=http://supabase-mock
      - ENVIRONMENT=local
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: sh -c "python -m src.workers.main"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/artistica
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/artistica
      - SUPABASE_URL=http://supabase-mock
      - ENVIRONMENT=local
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
