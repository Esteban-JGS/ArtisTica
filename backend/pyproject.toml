[project]
name = "artistica-backend"
version = "0.1.0"
description = "Backend for ArtisTica"
authors = [
    {name = "Esteban", email = "esteban@example.com"}
]
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.2",
    "httpx>=0.26.0",
    "pillow>=10.2.0",
    "sentry-sdk[fastapi]>=1.40.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.16.8,<0.17",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Deuda: faltan "raise ... from" en archivos fuera del alcance del lote 0.
"src/api/deps.py" = ["B904"]
"src/core/security.py" = ["B904"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
