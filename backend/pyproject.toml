[project]
name = "artistica-backend"
version = "0.1.0"
description = "Backend for ArtisTica"
authors = [
    {name = "Esteban", email = "esteban@example.com"}
]
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.2",
    "httpx>=0.26.0",
    "pillow>=10.2.0",
    "sentry-sdk[fastapi]>=1.40.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.16.8,<0.17",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC",
    "DTZ", "RUF", "C4", "PIE", "PERF", "PTH", "LOG", "G",
    "SIM", "RET", "T20", "S", "BLE", "PT", "ERA", "N",
    "ARG", "FBT", "PL", "TRY", "FAST",
]
ignore = [
    "N818",     # Las excepciones del dominio se nombran en espanol, sin sufijo Error
    "PLR2004",  # Los literales de las reglas y de las pruebas se leen mejor en su lugar
    "PLR0913",  # Los servicios reciben sesion, pasarela, ids y politicas explicitos
    "PLR0917",  # Idem, en posicion
    "TRY003",   # Los mensajes en espanol de las excepciones son parte del dominio
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert es la forma de las pruebas
    "S105",  # secretos falsos de prueba
    "S106",  # idem, pasados como argumento
    "S603",  # subprocess con comandos fijos del repositorio
    "S607",  # idem, resueltos por PATH del entorno virtual
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
