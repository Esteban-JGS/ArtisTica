services:
  db:
    # Imagen de Postgres 15 configurada directamente con pgvector
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=artistica
    # Puerto del host configurable: el 5432 puede estar ocupado en la maquina
    ports:
      - "${DB_PUERTO_LOCAL:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    # Ejecuta migraciones e inicia el server con hot reload (watch de src)
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/artistica
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/artistica
      - SUPABASE_URL=http://supabase-mock
      - ENVIRONMENT=local
    # Sana solo cuando /health responde, o sea despues de migrar.
    # Usa python porque la imagen no garantiza curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: sh -c "python -m src.workers.main"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/artistica
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/artistica
      - SUPABASE_URL=http://supabase-mock
      - ENVIRONMENT=local
    # Espera a la API sana: asi la tabla jobs ya existe en su primera consulta
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
